<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordly Dictionary</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="light">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <h1>Wordly Dictionary</h1>
    <button id="theme-toggle" type="button" class="secondary-btn" aria-label="Switch color theme">
      Dark mode
    </button>
  </header>

  <main id="main-content">
    <section class="card search-card" aria-labelledby="search-heading">
      <h2 id="search-heading">Search</h2>
      <form id="search-form" role="search" aria-label="Dictionary search">
        <label for="word-input">Search for a word</label>
        <div class="search-row">
          <input
            id="word-input"
            type="text"
            placeholder="e.g. serendipity"
            autocomplete="off"
            required
            aria-describedby="search-hint status"
          />
          <button type="submit" class="primary-btn" aria-label="Search for word">Search</button>
        </div>
        <p id="search-hint" class="hint">Letters only. Apostrophes and hyphens are allowed.</p>
      </form>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <!-- Results placeholder: JavaScript fills this in after a search -->
    <section id="result" class="card result-card hidden" aria-label="Word details" aria-live="polite">
      <div class="result-header">
        <h2 id="result-word" class="result-word" data-placeholder="Word"></h2>
        <p id="result-phonetic" class="phonetic" data-placeholder="Pronunciation"></p>
        <div id="result-audio" class="audio-slot"></div>
        <button id="save-btn" type="button" class="save-btn" aria-pressed="false">Save word</button>
      </div>
      <div id="result-meanings"></div>
      <div id="result-sources" class="sources"></div>
    </section>

    <section class="card saved-card" aria-labelledby="saved-heading">
      <h2 id="saved-heading">Saved words</h2>
      <ul id="saved-list" class="saved-list" aria-label="Saved words list"></ul>
      <p id="saved-empty" class="muted">No saved words yet. Search for a word and click "Save word".</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>Definitions provided by the Free Dictionary API.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
